<section class="sale-list">
  <header class="page-header">
    <div>
      <h1>{{ "sales.title" | translate }}</h1>
      <p>{{ "sales.description" | translate }}</p>
    </div>
  </header>

  <div class="filters">
    <app-date-range-filter (rangeChange)="rangeChanged($event)" /><app-export-button [busy]="facade.exporting()" (export)="export()" />
  </div>

  <section class="summary-grid" [attr.aria-label]="'sales.summary' | translate">
    <app-summary-card labelKey="sales.totalRevenue" [value]="summaryMoney(facade.summary().totalRevenue)" />
    <app-summary-card labelKey="sales.totalCost" [value]="summaryMoney(facade.summary().totalCost)" />
    <app-summary-card labelKey="sales.totalProfit" [value]="summaryMoney(facade.summary().totalProfit)" />
    <app-summary-card labelKey="sales.totalItemsSold" [value]="facade.summary().totalItemsSold" />
  </section>

  @if (facade.error()) {
    <p class="error" role="alert">{{ facade.error() | translate }}</p>
  }

  @if (facade.sales().length) {
    <app-data-table [columns]="columns" [rows]="rows()" (rowClick)="openDetail($event)" />
  } @else if (!facade.loading()) {
    <app-empty-state titleKey="sales.emptyTitle" messageKey="sales.emptyMessage" />
  }
</section>
