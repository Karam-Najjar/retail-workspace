<section class="sale-list">
  <header class="page-header">
    <div>
      <h1>{{ "sales.title" | translate }}</h1>
      <p>{{ "sales.description" | translate }}</p>
    </div>
  </header>

  <div class="filters">
    <app-date-range-filter (rangeChange)="rangeChanged($event)" /><app-export-button [busy]="facade.exporting()" (export)="export()" />
  </div>

  <section class="summary-grid" [attr.aria-label]="'sales.summary' | translate">
    <app-summary-card
      tone="revenue"
      labelKey="sales.totalRevenue"
      [primaryValue]="formatPrimary(facade.summary().totalRevenue) + ' $'"
      [secondaryValue]="formatSecondary(facade.summary().totalRevenueSyp)" />
    <app-summary-card
      tone="cost"
      labelKey="sales.totalCost"
      [primaryValue]="formatPrimary(facade.summary().totalCost) + ' $'"
      [secondaryValue]="formatSecondary(facade.summary().totalCostSyp)" />
    <app-summary-card
      tone="profit"
      labelKey="sales.totalProfit"
      [primaryValue]="formatPrimary(facade.summary().totalProfit) + ' $'"
      [secondaryValue]="formatSecondary(facade.summary().totalProfitSyp)" />
    <app-summary-card tone="items" labelKey="sales.totalItemsSold" [primaryValue]="facade.summary().totalItemsSold" />
  </section>

  @if (facade.sales().length) {
    <app-data-table [columns]="columns" [rows]="rows()" (rowClick)="openDetail($event)" />
    <app-paginator [page]="facade.page()" [totalPages]="facade.totalPages()" (pageChange)="goToPage($event)" />
  } @else if (!facade.loading()) {
    <app-empty-state titleKey="sales.emptyTitle" messageKey="sales.emptyMessage" />
  }
</section>
