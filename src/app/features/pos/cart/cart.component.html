<section class="cart"><header><h2>{{ 'pos.cart' | translate }}</h2><button mat-button color="warn" type="button" [disabled]="!items().length" (click)="clear.emit()">{{ 'pos.clearCart' | translate }}</button></header>@if (items().length) { @for (item of items(); track item.product_id + ':' + (item.product_barcode_id ?? 'search')) { <app-cart-item [item]="item" (increase)="increase.emit(item)" (decrease)="decrease.emit(item)" (remove)="remove.emit(item)" /> } } @else { <p>{{ 'pos.emptyCart' | translate }}</p> }</section>
