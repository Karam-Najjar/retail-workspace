<app-modal-form-shell titleKey="categories.formTitle" (cancel)="close()" (submit)="save()">
  <mat-form-field appearance="outline" class="name-field">
    <mat-label>{{ "categories.name" | translate }}</mat-label>
    <input matInput maxlength="100" required [(ngModel)]="name" />
    <mat-hint align="end">{{ name.length }}/100</mat-hint>
  </mat-form-field>
  @if (error) {
    <p class="form-error">{{ error | translate }}</p>
  }
</app-modal-form-shell>
