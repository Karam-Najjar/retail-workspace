<section class="category-list">
  <header class="page-header">
    <div>
      <h1>{{ 'categories.title' | translate }}</h1>
      <p>{{ 'categories.description' | translate }}</p>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="openCreate()">{{ 'categories.add' | translate }}</button>
  </header>

  @if (facade.hasCategories()) {
    <app-data-table [columns]="columns" [rows]="rows()" (rowClick)="openDetail($event)" />
  } @else if (!facade.loading()) {
    <app-empty-state titleKey="categories.emptyTitle" messageKey="categories.emptyMessage" />
  }
</section>
