<app-top-bar (navigationToggle)="toggleNavigation()" />

<mat-sidenav-container class="shell-container">
  <mat-sidenav #navigation class="shell-navigation" mode="side" opened>
    <app-side-nav (navigate)="closeNavigation()" />
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    @if (updates.ready()) {
      <div class="update-banner">
        {{ (cartHasItems() ? "pwa.updateClearCart" : "pwa.updateReady") | translate }}
        @if (!cartHasItems()) {
          <button mat-button (click)="updates.apply()">{{ "pwa.apply" | translate }}</button>
        }
      </div>
    }
    <main class="shell-main" [class.shell-main--no-padding]="isDetailRoute()">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-modal-outlet />
