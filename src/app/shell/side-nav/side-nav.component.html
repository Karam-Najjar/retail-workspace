<nav class="side-nav" [attr.aria-label]="'navigation.label' | translate">
  <div class="side-nav__heading">{{ 'app.title' | translate }}</div>

  <mat-nav-list>
    @for (item of navigationItems; track item.labelKey) {
      @if (item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="is-active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.labelKey | translate }}</span>
        </a>
      } @else {
        <div mat-list-item class="is-disabled" aria-disabled="true">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.labelKey | translate }}</span>
        </div>
      }
    }
  </mat-nav-list>
</nav>
