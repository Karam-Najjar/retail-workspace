<div class="supplier-picker">
  <mat-form-field appearance="outline">
    <mat-label>{{ 'supplies.supplier' | translate }}</mat-label>
    <mat-select required [ngModel]="selectedId()" (ngModelChange)="selectedIdChange.emit($event)">
      @for (supplier of suppliers(); track supplier.id) { <mat-option [value]="supplier.id">{{ supplier.name }}</mat-option> }
    </mat-select>
  </mat-form-field>
  <button mat-icon-button type="button" [attr.aria-label]="'supplies.quickAddSupplier' | translate" (click)="addRequested.emit()"><mat-icon>add</mat-icon></button>
</div>
