<figure class="circular-chart">
  <div class="circular-chart__visual">
    <svg viewBox="0 0 100 100" role="img" focusable="false" [attr.aria-label]="accessibleLabel()">
      <title>{{ accessibleLabel() }}</title>
      <circle class="circular-chart__track" cx="50" cy="50" r="42" pathLength="100" />
      @if (hasData()) {
        @for (segment of renderedSegments(); track $index) {
          @if (segment.value > 0) {
            <circle
              class="circular-chart__segment"
              cx="50"
              cy="50"
              r="42"
              pathLength="100"
              [attr.stroke]="segment.color"
              [attr.stroke-dasharray]="segment.dashArray"
              [attr.stroke-dashoffset]="segment.dashOffset" />
          }
        }
      }
    </svg>
    <div class="circular-chart__center" aria-hidden="true">
      <strong>{{ centerText() }}</strong>
      <span>{{ centerLabel() }}</span>
    </div>
  </div>

  <ul class="circular-chart__legend">
    @for (segment of renderedSegments(); track $index) {
      <li>
        <span class="circular-chart__swatch" [style.background-color]="segment.color" aria-hidden="true"></span>
        <span class="circular-chart__label">{{ segment.label }}</span>
        <strong class="circular-chart__value">{{ segment.value }}</strong>
      </li>
    }
  </ul>
</figure>
