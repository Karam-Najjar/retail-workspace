<mat-card appearance="outlined" class="modal-form-shell">
  <mat-card-header>
    <mat-card-title>{{ titleKey() | translate }}</mat-card-title>
  </mat-card-header>
  <mat-card-content><ng-content /></mat-card-content>
  <mat-card-actions align="end">
    <button mat-button type="button" (click)="close()">{{ 'common.cancel' | translate }}</button>
    <button mat-flat-button color="primary" type="button" (click)="submit.emit()">{{ 'common.save' | translate }}</button>
  </mat-card-actions>
</mat-card>
