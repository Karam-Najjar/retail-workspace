<mat-card appearance="outlined" class="confirmation-dialog">
  <mat-card-header><mat-card-title>{{ titleKey() | translate }}</mat-card-title></mat-card-header>
  <mat-card-content><p>{{ message() }}</p></mat-card-content>
  <mat-card-actions align="end">
    <button mat-button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <button mat-flat-button color="warn" type="button" (click)="confirm()">{{ 'common.confirm' | translate }}</button>
  </mat-card-actions>
</mat-card>
